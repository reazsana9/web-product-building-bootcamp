<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <!-- Tailwind CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- Custom CSS -->
    <link rel="stylesheet" href="./style.css">
</head>

<body>
    <h2
        class="text-purple-500 text-4xl bg-slate-900 bg-[url(https://images.unsplash.com/photo-1505740420928-5e560c06d30e?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80)]bg-center bg-cover h-375">
        Hello, Tailwind!</h2>


    <h3
        class="bg-black md:bg-green-500 text-white md:text-black xl:bg-yellow-500 xl:text-green-500 border-4 border-amber-500 text-[25px] sm:text-[30px] md:text-[50px] xl:text-[80px] rounded-2xl font-bold text-center mt-3.75">
        Programming Hero
    </h3>


    <h2 class="test">Our first responsive element</h2>

    <!-- Card -->
     <h2 class="font-bold text-5xl text-red-500">Layout using Flex</h2>
    <div class="my-8 flex flex-col md:flex-row gap-2">
        <div
            class="h-64 w-full bg-green-500 rounded-2xl p-6.25 border-4 flex justify-center items-center font-bold text-3xl">
            Card 1
        </div>
        <div
            class="h-64 w-full bg-green-500 rounded-2xl p-6.25 border-4 flex justify-center items-center font-bold text-3xl">
            Card 2
        </div>
        <div
            class="h-64 w-full bg-green-500 rounded-2xl p-6.25 border-4 flex justify-center items-center font-bold text-3xl">
            Card 3
        </div>
        <div
            class="h-64 w-full bg-green-500 rounded-2xl p-6.25 border-4 flex justify-center items-center font-bold text-3xl">
            Card 4
        </div>
    </div>

    <!-- Card -->
     <h2 class="font-bold text-5xl text-red-500">Layout using Grid</h2>
    <div class="my-8 grid grid-cols-1 md:grid-cols-12 gap-4">
        <div
            class="h-64 w-full bg-green-500 rounded-2xl p-6.25 border-4 flex justify-center items-center font-bold text-3xl col-span-1 md:col-span-2">
            Card 1
        </div>
        <div
            class="h-64 w-full bg-green-500 rounded-2xl p-6.25 border-4 flex justify-center items-center font-bold text-3xl col-span-1 md:col-span-4">
            Card 2
        </div>
        <div
            class="h-64 w-full bg-green-500 rounded-2xl p-6.25 border-4 flex justify-center items-center font-bold text-3xl col-span-1 md:col-span-4">
            Card 3
        </div>
        <div
            class="h-64 w-full bg-green-500 rounded-2xl p-6.25 border-4 flex justify-center items-center font-bold text-3xl col-span-2">
            Card 4
        </div>
    </div>



    <!-- Card Container -->
    <div
        class="max-w-sm bg-white rounded-2xl shadow-lg overflow-hidden border border-slate-100 hover:shadow-xl transition-shadow duration-300">

        <!-- Image Section -->
        <div class="relative h-64 overflow-hidden group">
            <img src="https://images.unsplash.com/photo-1505740420928-5e560c06d30e?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80"
                alt="Product"
                class="w-full h-full object-cover transform group-hover:scale-105 transition-transform duration-500">
            <!-- Badge -->
            <span
                class="absolute top-4 left-4 bg-blue-600 text-white text-xs font-bold px-3 py-1 rounded-full shadow-sm">
                BESTSELLER
            </span>
        </div>

        <!-- Content Section -->
        <div class="p-6">
            <!-- Category -->
            <p class="text-blue-500 text-xs font-bold tracking-widest uppercase mb-2">Electronics</p>

            <!-- Title -->
            <h3 class="text-xl font-bold text-slate-800 leading-tight mb-2">
                Wireless Studio Headphones
            </h3>

            <!-- Rating -->
            <div class="flex items-center gap-1 mb-4">
                <!-- Filled Stars -->
                <div class="flex text-yellow-400">
                    <svg class="w-4 h-4 fill-current" viewBox="0 0 20 20">
                        <path
                            d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z" />
                    </svg>
                    <svg class="w-4 h-4 fill-current" viewBox="0 0 20 20">
                        <path
                            d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z" />
                    </svg>
                    <svg class="w-4 h-4 fill-current" viewBox="0 0 20 20">
                        <path
                            d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z" />
                    </svg>
                    <svg class="w-4 h-4 fill-current" viewBox="0 0 20 20">
                        <path
                            d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z" />
                    </svg>
                    <svg class="w-4 h-4 fill-current" viewBox="0 0 20 20">
                        <path
                            d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z" />
                    </svg>
                </div>
                <span class="text-slate-400 text-xs font-medium">(128 reviews)</span>
            </div>

            <!-- Price -->
            <div class="flex items-center gap-3 mb-6">
                <span class="text-2xl font-bold text-blue-600">$249.00</span>
                <span class="text-sm text-slate-400 line-through">$329.00</span>
            </div>

            <!-- Button -->
            <button
                class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-xl transition-colors duration-200 flex items-center justify-center gap-2 group">
                <svg class="w-5 h-5 transition-transform group-hover:translate-x-1" fill="none" stroke="currentColor"
                    viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 8l4 4m0 0l-4 4m4-4H3">
                    </path>
                </svg>
                Add to Cart
            </button>
        </div>
    </div>
</body>

</html>
